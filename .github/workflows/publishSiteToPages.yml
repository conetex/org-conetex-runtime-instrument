name: Publish AsciiDoc, Jacoco, JavaDoc to Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      #
      # Java
      #
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      #
      # Maven verify
      #
      - name: Build site
        run: mvn -B verify

      # ==================================================
      # Copy module JavaDocs + Coverage
      # ==================================================
      - name: Collect reports
        run: |
          
          modules=(
            interfaces
            counter
            collection
            metrics-cost
            metrics-cost-unnamed
            agent
            example
          
            tests/empty
            tests/jar
            tests/jar-blocked
            tests/jar-module
            tests/integration
          )
          
          for module in "${modules[@]}"; do
          
            module_name=$(basename "$module")
          
            echo "Processing $module"
          
            # ------------------------------
            # JavaDoc
            # ------------------------------
          
            if [ -d "$module/target/reports/apidocs" ]; then
              mkdir -p "target/site/apidocs/$module_name"
          
              cp -r \
                "$module/target/reports/apidocs/"* \
                "target/site/apidocs/$module_name/"
            fi
          
            # ------------------------------
            # JaCoCo
            # ------------------------------
          
            if [ -d "$module/target/site/jacoco" ]; then
              mkdir -p "target/site/jacoco/$module_name"
          
              cp -r \
                "$module/target/site/jacoco/"* \
                "target/site/jacoco/$module_name/"
            fi
          
          done
  


      # ==================================================
      # Upload GitHub Pages artifact
      # ==================================================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4