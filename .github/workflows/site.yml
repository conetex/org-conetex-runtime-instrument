  name: Publish Documentation

  on:
    push:
      branches:
        - main

  permissions:
    contents: read
    pages: write
    id-token: write

  concurrency:
    group: pages
    cancel-in-progress: true

  jobs:

    build-docs:
      runs-on: ubuntu-latest

      steps:

        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 21
            cache: maven

        - name: Build
          run: mvn -B clean verify

        # ==================================================
        # Create final site structure
        # ==================================================

        - name: Create site directories
          run: |
            mkdir -p target/site
            mkdir -p target/site/apidocs
            mkdir -p target/site/coverage

        # ==================================================
        # Copy AsciiDoc site
        # ==================================================

        - name: Copy generated docs
          run: |
            cp -r target/generated-docs/* target/site/

        # ==================================================
        # Copy module JavaDocs + Coverage
        # ==================================================

        - name: Collect reports
          run: |
            
            modules=(
              interfaces
              counter
              collection
              metrics-cost
              metrics-cost-unnamed
              agent
              example
            
              tests/empty
              tests/jar
              tests/jar-blocked
              tests/jar-module
              tests/integration
            )
            
            for module in "${modules[@]}"; do
            
              module_name=$(basename "$module")
            
              echo "Processing $module"
            
              # ------------------------------
              # JavaDoc
              # ------------------------------
            
              if [ -d "$module/target/reports/apidocs" ]; then
                mkdir -p "target/site/apidocs/$module_name"
            
                cp -r \
                  "$module/target/reports/apidocs/"* \
                  "target/site/apidocs/$module_name/"
              fi
            
              # ------------------------------
              # JaCoCo
              # ------------------------------
            
              if [ -d "$module/target/site/jacoco" ]; then
                mkdir -p "target/site/coverage/$module_name"
            
                cp -r \
                  "$module/target/site/jacoco/"* \
                  "target/site/coverage/$module_name/"
              fi
            
            done

        # ==================================================
        # Upload GitHub Pages artifact
        # ==================================================

        - name: Upload Pages artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: target/site

    deploy:
      needs: build-docs

      runs-on: ubuntu-latest

      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}

      steps:

        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4