name: Check Maven Version Format

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  version-format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version from PR branch
        run: |
          PR_VERSION=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          echo "PR_VERSION=$PR_VERSION" >> $GITHUB_ENV

      - name: Validate version format
        run: |
          echo "version from PR: $PR_VERSION"

          if [[ ! "$PR_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "❌ Version does not match required pattern major.minor.patch (no leading zeros)"
            echo "   Expected: ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$"
            echo "       e.g.: 1.2.3 or 0.1.2"
            exit 1
          fi

          echo "✔️ Version format OK"
